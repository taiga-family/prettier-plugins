name: Lint
on: [pull_request]

jobs:
  eslint:
    runs-on: ubuntu-latest
    steps:
      - uses: taiga-family/ci/actions/setup/checkout@c9ef7dc7298d7382a98a9248feaf5aa3251d837e # v1.55.5
      - uses: taiga-family/ci/actions/setup/variables@c9ef7dc7298d7382a98a9248feaf5aa3251d837e # v1.55.5
      - uses: taiga-family/ci/actions/setup/node@c9ef7dc7298d7382a98a9248feaf5aa3251d837e # v1.55.5
      - run: npm run lint ${{ env.SUPPORT_AUTO_PUSH == 'true' && '-- --fix' || '' }}
      - uses: taiga-family/ci/actions/auto/push@c9ef7dc7298d7382a98a9248feaf5aa3251d837e # v1.55.5
        with:
          token: ${{ secrets.TAIGA_FAMILY_BOT_PAT }}

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
