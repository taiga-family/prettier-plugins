name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    if: ${{ !contains(github.head_ref, 'release/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: taiga-family/ci/actions/setup/checkout@c9ef7dc7298d7382a98a9248feaf5aa3251d837e # v1.55.5
      - uses: taiga-family/ci/actions/setup/variables@c9ef7dc7298d7382a98a9248feaf5aa3251d837e # v1.55.5
      - uses: taiga-family/ci/actions/setup/node@c9ef7dc7298d7382a98a9248feaf5aa3251d837e # v1.55.5

      - name: Run tests
        run: npm test

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
